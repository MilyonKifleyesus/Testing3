<div class="main-container container-fluid px-0">
  <div class="d-md-flex d-block align-items-center justify-content-between my-4 page-header-breadcrumb">
    <div>
      <h1 class="page-title fw-semibold fs-20 mb-0">Edit Time Log</h1>
      <nav>
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a routerLink="/admin">Home</a></li>
          <li class="breadcrumb-item"><a routerLink="/admin/timesheet">Time Logs</a></li>
          <li class="breadcrumb-item active" aria-current="page">Edit</li>
        </ol>
      </nav>
    </div>
    <div class="btn-list">
      <button type="button" class="btn btn-light btn-wave btn-sm" (click)="backToList()">
        <i class="ti ti-arrow-left me-2"></i>Back to Time Logs
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-12">
      <div class="card custom-card">
        <div class="card-body">
          <p *ngIf="loading" class="text-muted mb-0">Loading…</p>
          <p *ngIf="error" class="text-danger mb-0">{{ error }}</p>
          <form *ngIf="!loading && !error" [formGroup]="editForm" (ngSubmit)="onSubmit()" class="row g-3">
            <div class="col-md-6 col-lg-4">
              <label class="form-label">Project <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="projectId">
                <option value="">Select project…</option>
                <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
              </select>
            </div>
            <div class="col-md-6 col-lg-4">
              <label class="form-label">Vehicle <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="vehicleId">
                <option value="">Select vehicle…</option>
                <option *ngFor="let v of vehicleOptions" [value]="v.id">{{ v.name }}</option>
              </select>
            </div>
            <div class="col-md-6 col-lg-4">
              <label class="form-label">User <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="userId">
                <option value="">Select user…</option>
                <option *ngFor="let i of users" [value]="i.id">{{ i.name }}</option>
              </select>
            </div>
            <div class="col-md-6 col-lg-4">
              <label class="form-label">Type of Time <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="typeOfTime">
                <option value="">Select type…</option>
                <option *ngFor="let t of typeOfTimeOptions" [value]="t">{{ t }}</option>
              </select>
            </div>
            <div class="col-md-6 col-lg-4">
              <label class="form-label">Start Date/Time <span class="text-danger">*</span></label>
              <input type="datetime-local" class="form-control" formControlName="startDateTime" />
            </div>
            <div class="col-md-6 col-lg-4">
              <label class="form-label">Spent Time (hours) <span class="text-danger">*</span></label>
              <input type="number" step="0.25" min="0.01" class="form-control" formControlName="spentTimeHours" />
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" formControlName="description" rows="3"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary me-2" [disabled]="editForm.invalid || saving">
                {{ saving ? 'Saving…' : 'Save' }}
              </button>
              <button type="button" class="btn btn-light" (click)="backToList()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
